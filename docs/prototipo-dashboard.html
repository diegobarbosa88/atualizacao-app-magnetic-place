<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Magnetic Place</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1B3A57;
    --navy-deep:#122741;
    --navy-mid:#20415F;
    --orange:#EB8D00;
    --orange-deep:#C97600;
    --slate:#869AAF;
    --slate-dim:#5C7086;
    --bg:#EFEDE7;
    --panel:#FFFFFF;
    --ink:#1A1D21;
    --ink-soft:#51606E;
    --ok:#2E7D4F;
    --ok-bg:#E7F3EB;
    --bad:#B4432F;
    --bad-bg:#FBEAE6;
    --warn:#D98A2B;
    --warn-bg:#FBF0DE;
    --radius:16px;
    --radius-sm:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(circle at 100% 0%, rgba(27,58,87,0.06), transparent 45%),
      repeating-linear-gradient(135deg, rgba(134,154,175,0.05) 0px, rgba(134,154,175,0.05) 1px, transparent 1px, transparent 14px);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    display:flex;
    justify-content:center;
    min-height:100vh;
  }
  .device{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
    padding-bottom:86px;
  }

  /* ================= HEADER ================= */
  .header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 18px 14px;
    background:var(--panel);
    border-bottom:1px solid #E2DED4;
  }
  .id-block{display:flex;align-items:center;gap:12px;}
  .avatar{
    width:46px;height:46px;
    border-radius:50%;
    background:var(--navy-deep);
    display:flex;align-items:center;justify-content:center;
    color:var(--orange);
    font-family:'Barlow Condensed',sans-serif;
    font-weight:800;font-size:17px;
    flex-shrink:0;
    border:2px solid var(--orange);
  }
  .id-text .name{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:800;
    font-size:16.5px;
    color:var(--navy-deep);
    letter-spacing:0.01em;
    line-height:1.15;
  }
  .id-text .role{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    font-weight:600;
    letter-spacing:0.06em;
    color:var(--orange-deep);
    text-transform:uppercase;
    margin-top:2px;
  }
  .header-actions{display:flex;align-items:center;gap:10px;}
  .icon-btn{
    width:38px;height:38px;
    border-radius:50%;
    background:#F0EEE7;
    border:none;
    display:flex;align-items:center;justify-content:center;
    color:var(--navy);
    cursor:pointer;
    position:relative;
  }
  .icon-btn svg{width:19px;height:19px;}
  .badge-dot{
    position:absolute;top:-2px;right:-2px;
    width:16px;height:16px;
    background:var(--orange);
    border-radius:50%;
    border:2px solid var(--panel);
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:9px;font-weight:700;color:#fff;
  }

  .content{padding:16px 16px 0;}

  /* ================= TIME PANEL ================= */
  .time-panel{
    background:var(--navy-deep);
    background-image:radial-gradient(circle at 90% -10%, rgba(235,141,0,0.14), transparent 55%);
    border-radius:var(--radius);
    padding:20px 20px 18px;
    color:#fff;
    position:relative;
    overflow:hidden;
  }
  .time-toprow{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:18px;
  }
  .date-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.09em;
    text-transform:uppercase;
    color:var(--slate);
  }
  .month-switch{
    display:flex;align-items:center;gap:10px;
    background:rgba(255,255,255,0.07);
    border-radius:20px;
    padding:5px 6px;
  }
  .month-switch button{
    width:22px;height:22px;
    border-radius:50%;
    border:none;
    background:transparent;
    color:var(--slate);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .month-switch button:hover{color:#fff;}
  .month-switch button svg{width:13px;height:13px;}
  .month-switch .val{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;font-weight:700;color:#fff;
    letter-spacing:0.03em;
    min-width:38px;text-align:center;
  }

  .clock-row{
    display:flex;align-items:flex-end;gap:6px;
    margin-bottom:20px;
  }
  .clock-main{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:58px;
    line-height:1;
    letter-spacing:-0.01em;
    color:#fff;
    font-variant-numeric:tabular-nums;
  }
  .clock-sec{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:24px;
    color:var(--slate);
    padding-bottom:6px;
    font-variant-numeric:tabular-nums;
  }

  .stats-row{display:flex;gap:10px;}
  .stat-card{
    flex:1;
    border-radius:var(--radius-sm);
    padding:12px 14px;
    background:rgba(255,255,255,0.06);
  }
  .stat-card.accent{background:rgba(235,141,0,0.14);}
  .stat-top{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:6px;
  }
  .stat-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;letter-spacing:0.08em;
    text-transform:uppercase;color:var(--slate);
  }
  .stat-top svg{width:14px;height:14px;color:var(--orange);}
  .stat-val{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:800;font-size:24px;color:#fff;
  }

  /* ================= CHECK-IN PANEL ================= */
  .checkin-panel{
    margin-top:14px;
    border-radius:var(--radius);
    padding:20px;
    background:var(--navy);
    background-image:linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
    position:relative;
    overflow:hidden;
  }
  .checkin-panel::after{
    content:"";
    position:absolute;right:-30px;top:-30px;
    width:130px;height:130px;
    border-radius:50%;
    background:rgba(235,141,0,0.10);
  }
  .checkin-top{
    display:flex;align-items:flex-start;gap:14px;
    margin-bottom:18px;position:relative;z-index:1;
  }
  .checkin-icon{
    width:46px;height:46px;flex-shrink:0;
    border-radius:12px;
    background:rgba(255,255,255,0.12);
    display:flex;align-items:center;justify-content:center;
    color:var(--orange);
  }
  .checkin-icon svg{width:24px;height:24px;}
  .checkin-eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;
    color:var(--slate);margin:0 0 2px;
  }
  .checkin-site{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:800;font-size:21px;color:#fff;
    line-height:1.1;margin:0 0 8px;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  }
  .site-status-dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex-shrink:0;}
  .loc-chip{
    display:inline-flex;align-items:center;gap:5px;
    background:var(--warn-bg);
    color:var(--warn);
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;font-weight:700;letter-spacing:0.03em;
    padding:4px 10px;border-radius:20px;
    text-transform:uppercase;
  }
  .loc-chip svg{width:11px;height:11px;}

  .btn-checkin{
    width:100%;
    background:var(--orange);
    color:#fff;
    border:none;
    border-radius:12px;
    padding:15px;
    font-family:'Inter',sans-serif;
    font-weight:700;font-size:15px;
    display:flex;align-items:center;justify-content:center;gap:9px;
    cursor:pointer;
    position:relative;z-index:1;
    transition:background .15s ease, transform .1s ease;
  }
  .btn-checkin:hover{background:var(--orange-deep);}
  .btn-checkin:active{transform:scale(0.98);}
  .btn-checkin svg{width:18px;height:18px;}

  /* ================= CALENDAR PANEL ================= */
  .cal-panel{
    margin-top:14px;
    background:var(--panel);
    border-radius:var(--radius);
    border:1px solid #E2DED4;
    padding:18px 16px 12px;
  }
  .cal-header{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:14px;
  }
  .cal-title{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:800;font-size:18px;color:var(--navy-deep);
    letter-spacing:0.01em;
  }
  .cal-legend{
    display:flex;align-items:center;gap:6px;
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;color:var(--slate-dim);
    text-transform:uppercase;
  }
  .cal-legend .dot{width:7px;height:7px;border-radius:50%;background:var(--orange);}

  .seam-divider{
    height:2px;
    background-image:repeating-linear-gradient(90deg, var(--slate) 0 6px, transparent 6px 10px);
    opacity:0.5;
    margin-bottom:14px;
  }

  .weekdays{
    display:grid;grid-template-columns:repeat(7,1fr);
    margin-bottom:8px;
  }
  .weekdays span{
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;font-weight:700;
    color:var(--slate-dim);
    text-transform:uppercase;
  }
  .days-grid{
    display:grid;grid-template-columns:repeat(7,1fr);
    row-gap:6px;
  }
  .day-cell{
    aspect-ratio:1/1;
    display:flex;align-items:center;justify-content:center;
    margin:2px auto;
    width:38px;height:38px;
    border-radius:10px;
    font-family:'Inter',sans-serif;
    font-weight:600;font-size:13.5px;
    color:var(--ink);
    background:transparent;
    position:relative;
  }
  .day-cell.muted{color:#C9C4B7;}
  .day-cell.weekend{color:var(--slate-dim);}
  .day-cell.today{
    background:var(--orange);
    color:#fff;
    font-weight:800;
    box-shadow:0 3px 10px rgba(235,141,0,0.35);
  }
  .day-cell.hasdata::after{
    content:"";
    position:absolute;bottom:4px;left:50%;
    transform:translateX(-50%);
    width:4px;height:4px;border-radius:50%;
    background:var(--ok);
  }
  .day-cell.today.hasdata::after{background:#fff;}

  /* ================= BOTTOM NAV ================= */
  .bottom-nav{
    position:fixed;
    bottom:0;left:50%;
    transform:translateX(-50%);
    width:100%;max-width:430px;
    background:var(--panel);
    border-top:1px solid #E2DED4;
    display:flex;
    padding:9px 4px 12px;
    z-index:10;
  }
  .nav-item{
    flex:1;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    background:none;border:none;cursor:pointer;
    color:var(--slate-dim);
    padding:4px 2px;
    position:relative;
  }
  .nav-item svg{width:21px;height:21px;}
  .nav-item span{
    font-family:'IBM Plex Mono',monospace;
    font-size:8.6px;font-weight:700;letter-spacing:0.01em;
    text-transform:uppercase;
  }
  .nav-item.active{color:var(--orange);}
  .nav-item .nav-dot{
    position:absolute;top:0px;right:22%;
    width:7px;height:7px;border-radius:50%;
    background:var(--bad);
    border:1.5px solid var(--panel);
  }

  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>

<div class="device">

  <!-- ===== HEADER ===== -->

    <div class="id-block">
      <div class="avatar">MP</div>

        <span class="badge-dot">1</span>
      </button>
      <button class="icon-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>

  </div>

  <div class="content">

    <div class="time-panel">
      <div class="time-toprow">
        <span class="date-label" id="dateLabel">QUINTA-FEIRA, 20 AGOSTO</span>
        <div class="month-switch">
          <button onclick="shiftMonth(-1)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <span class="val" id="monthVal">08/26</span>
          <button onclick="shiftMonth(1)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </button>

      </div>

      <div class="clock-row">
        <span class="clock-main" id="clockMain">10:57</span>

        <div class="stat-card accent">
          <div class="stat-top">
            <span class="stat-label">Agosto</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
          </div>
          <div class="stat-val">0h00</div>

    <!-- ===== CHECK-IN PANEL ===== -->

      <div class="checkin-top">
        <div class="checkin-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </div>
        <div>
          <p class="checkin-eyebrow">Registar entrada em</p>
          <p class="checkin-site"><span class="site-status-dot"></span>Ferrocal Steel Sol...</p>
          <span class="loc-chip">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.4"/></svg>
            Fora · 3278m
          </span>
        </div>
      </div>
      <button class="btn-checkin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
        Registar Entrada

    </div>

    <!-- ===== CALENDAR PANEL ===== -->
    <div class="cal-panel">
      <div class="cal-header">
        <span class="cal-title" id="calTitle">Agosto de 2026</span>
        <span class="cal-legend"><span class="dot"></span>Hoje</span>
      </div>
      <div class="seam-divider"></div>
      <div class="weekdays">
        <span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span><span>Dom</span>
      </div>
      <div class="days-grid" id="daysGrid"></div>

  </div>

  <!-- ===== BOTTOM NAV ===== -->
  <div class="bottom-nav">
    <button class="nav-item active">

    <button class="nav-item">

      <span>Horários</span>
    </button>
    <button class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M9.5 15.5l2 2 3.5-3.5"/></svg>
      <span>Falta</span>
    </button>
    <button class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg>
      <span>Documentos</span>
    </button>
    <button class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/></svg>
      <span>Formação</span>
      <span class="nav-dot"></span>
    </button>
    <button class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>
      <span>Perfil</span>
    </button>
    <button class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>Admin</span>
    </button>
  </div>

</div>

<script>
  function pad(n){ return n.toString().padStart(2,'0'); }
  function tickClock(){
    const now = new Date();
    document.getElementById('clockMain').textContent = pad(now.getHours())+':'+pad(now.getMinutes());
    document.getElementById('clockSec').textContent = pad(now.getSeconds());
    const dias = ['DOMINGO','SEGUNDA-FEIRA','TERÇA-FEIRA','QUARTA-FEIRA','QUINTA-FEIRA','SEXTA-FEIRA','SÁBADO'];
    const meses = ['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
    document.getElementById('dateLabel').textContent = `${dias[now.getDay()]}, ${now.getDate()} ${meses[now.getMonth()]}`;
  }
  tickClock();
  setInterval(tickClock, 1000);

  let calYear = 2026, calMonth = 7;
  const mesesFull = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const mesesShort = ['01','02','03','04','05','06','07','08','09','10','11','12'];

  function shiftMonth(dir){
    calMonth += dir;
    if(calMonth > 11){ calMonth=0; calYear++; }
    if(calMonth < 0){ calMonth=11; calYear--; }
    renderCalendar();
  }

  function renderCalendar(){
    document.getElementById('calTitle').textContent = `${mesesFull[calMonth]} de ${calYear}`;
    document.getElementById('monthVal').textContent = `${mesesShort[calMonth]}/${calYear.toString().slice(-2)}`;

    const grid = document.getElementById('daysGrid');
    grid.innerHTML = '';

    const firstDay = new Date(calYear, calMonth, 1);
    let startOffset = (firstDay.getDay() + 6) % 7;
    const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
    const daysInPrevMonth = new Date(calYear, calMonth, 0).getDate();

    const todayReal = new Date();
    const isCurrentMonthReal = todayReal.getFullYear()===calYear && todayReal.getMonth()===calMonth;

    for(let i=startOffset; i>0; i--){
      const d = daysInPrevMonth - i + 1;
      grid.insertAdjacentHTML('beforeend', `<div class="day-cell muted">${d}</div>`);
    }
    for(let d=1; d<=daysInMonth; d++){
      const dow = (startOffset + d - 1) % 7;
      const isWeekend = dow===5 || dow===6;
      const isToday = isCurrentMonthReal && d===todayReal.getDate();
      let cls = 'day-cell';
      if(isWeekend) cls += ' weekend';
      if(isToday) cls += ' today';
      grid.insertAdjacentHTML('beforeend', `<div class="${cls}">${d}</div>`);
    }
    const totalCells = startOffset + daysInMonth;
    const trailing = (7 - (totalCells % 7)) % 7;
    for(let d=1; d<=trailing; d++){
      grid.insertAdjacentHTML('beforeend', `<div class="day-cell muted">${d}</div>`);
    }
  }
  renderCalendar();
</script>
</body>
</html>
